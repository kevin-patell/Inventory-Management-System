{% extends "base.html" %}

{% block title %}Internal Server Error (500){% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-md-6">
    <div class="stat-icon danger mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
      <i class="bi bi-exclamation-triangle"></i>
    </div>
    <h3 class="fw-bold text-dark mb-2">500 - Internal Server Error</h3>
    <p class="text-muted small mb-4">An unexpected error occurred while processing your request. Please try again or contact the administrator.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">
      <i class="bi bi-grid-1x2 me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
