{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-md-6">
    <div class="stat-icon warning mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
      <i class="bi bi-question-circle"></i>
    </div>
    <h3 class="fw-bold text-dark mb-2">404 - Page Not Found</h3>
    <p class="text-muted small mb-4">The inventory page or resource you are looking for does not exist or has been moved.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">
      <i class="bi bi-grid-1x2 me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
