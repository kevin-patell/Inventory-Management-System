{% extends "base.html" %}

{% block title %}Access Denied (403){% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-md-6">
    <div class="stat-icon danger mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
      <i class="bi bi-shield-x"></i>
    </div>
    <h3 class="fw-bold text-dark mb-2">403 - Access Denied</h3>
    <p class="text-muted small mb-4">You do not possess the required role permissions to access this administrative resource.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">
      <i class="bi bi-grid-1x2 me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
